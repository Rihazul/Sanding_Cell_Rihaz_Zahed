settings:
  debug: true # Console logging enabled
  actualScan: true
  useTool: true
  scanPostHoming: true
  scanReturnToXStartAfterSection: false
  scanHomeImmediatelyAfterFinalDoorYEnd: true
  scanMoveSafePointAfterToolDrop: false
  scanFixedPocketFrameMm: 57
  scanPocketFallbackMinDepthMm: 2.5
  scanPocketFallbackMaxDepthMm: 14
  tableAWorkerStartDelaySeconds: 0.75

server:
  ip: '192.168.0.104'
  port: 9092
  cpip: '192.168.0.10' 
  cps: 10003
  frontEnd_base_url: "http://127.0.0.1:5100"
  frontEnd_messaging_url: "http://127.0.0.1:5100/trigger"

coords:
  # We have tcps for each thing (laser and tools)
  tcpDefault    : "TCP_Laser"   # This is the default TCP (TCP laser)
  tcpLaser      : "TCP_Laser"     # This is the TCP for laser
  tcpFrameTool  : "TCP_tool1" # This is TCP for square bottom facing sanding tool for frame
  tcpPocketTool : "TCP_tool1" # This is TCP for square bottom facing sanding tool for pocket
  tcp3DTool     : "TCP_tool1" # This is TCP for 3D tool for 3D face
  tcpSideTool   : "TCP_toolVert" # This is TCP for square side facing sanding tool for side
  tcpEdgeTool   : "TCP_toolVert" # This is TCP for square side facing sanding tool for outer edge
  tcpEdgeToolIn : "TCP_toolVert" # This is TCP for square side facing sanding tool for inner edge
  tcpReal       : "TCP_tool1_real" # This is the TCP for the real tool
  
  tcpLaserPlane1 : "TCP_laserplane1" #This is the laser for Plane 1
  tcptool1plane1 : "TCP_tool1plane1" #This is the tcp for tool 1
  tcptool2plane1 : "TCP_tool2plane1" #THis is the tcp for tool 2
  tcptool3plane1 : "TCP_tool3plane1" # This is the tcp for tool 3
  tcptool4plane1 : "TCP_tool4plane1" # This is the tcp for tool 4
  
  tcptool1plane2 : "TCP_tool1Plane2" #This is the tcp for tool 1 for plane 2
  tcptool4plane2 : "TCP_tool4Plane2" # This is the tcp for tool 4 for plane 2
  tcptool3plane2 : "TCP_tool3plane2" # This is the tcp for tool 3 for plane 2
  tcptool2plane2 : "TCP_toolVert" # This is the tcp for tool 2 for plane 2
  
  # We have 2 UCS (User Coordinate System)
  ucsDefault: "Base"  # This is the base UCS (used while homing, tool changing etc.)
  ucsTable1: "Plane_1" # This is the UCS for table 1 (left table) (used for scanning and sanding)
  ucsTable2: "Plane_2" # This is the plane for table 2
  roboVelocity: 400 # Increased from 200 to 300 by rafat
  roboAcceleration: 1950 # Increased from 250 to 350 by rafat
  sandingVelocity: 275 # Increased from 150 to 250 by rafat
  sandingAcceleration: 350 # Increased from 250 to 350 by rafat
  highSpeedAccelerationScale: 1.0 # Keeps acceleration at base value when speed > 1
  transitionRadius: 20 # Decreased from 10 to 5 by rafat
  # roboVelocity: 200
  # roboAcceleration: 250
  # transitionRadius: 30


table:
  length0: 585
  length1: 620
  length2: 620
  length3: 660
  # These are the 7th Axis Values used when scanning the table
  lengthx0: 0
  lengthx1: 647
  lengthx2: 1286
  lengthx3: 1928
  width: 880 # 675 to 870 mm
  sevenbtest: 0 #Test for the 7 axis in for Table B limitation 2200 for the software
  # angle: 42.5
  angle: 0
  count: 4

offset:
  seventhAxis: 0 #564
  toolRadius: 35
  tool3x: 75
  tool3y: 100
  toolin: 0
  scannerOffsetInLeft   : 6 # Start X scan 6mm before the expected door reference.
  scannerOffsetInBottom : 10 # Start Y scan 10mm before the expected door reference.
  scanLiftZMm: 0
  doorYOffset: 150 #Initial 50
  innerSandingOffset: 60
  edgeOffset: 0  # Previously it 15
  innerOffset: 3


scanThreshold:
  # 1, 2, 3, are model numbers
  T1: 1 # Increased from 1 to 1.2 by rafat
  T2: 0.8 # Increased from 0.8 to 1.0 by rafat
  T3: 0.3 # Increased from 0.3 to 0.4 by rafat
  T4: 0.2 # Increased from 0.2 to 0.3 by rafat
  T5: 0.8 # Increased from 0.8 to 1.0 by rafat

scanThresholdMinD:
  # 1, 2, 3, are model numbers
  T1: 0
  T2: 8 # Increased from 8 to 10 by rafat
  T3: 8 # Increased from 8 to 10 by rafat
  T4: 8 # Increased from 8 to 10 by rafat
  T5: 8 # Increased from 8 to 10 by rafat

# Model-agnostic scan profile used before task deployment.
scanThresholdDefault: 1
scanThresholdMinDDefault: 0
scanThreeDDefault: 0

door:
  frame: 60
  sandSpeed: 0.02 #0.02 real
  homingSpeed: 0.7
  edgeJ7StageOffsetMm: 0.0
  edgeJ7ReassertCount: 0
  edgeJ7ReassertPauseSec: 0.2
  edgeJ7HoldDuringPrepoint: false
  edgeJ7HoldDuringEdgePath: false
  seventhAxisEarlyDoneRetries: 0
  seventhAxisSettleWindowSec: 0.02
  seventhAxisSettleStableSamples: 1
  seventhAxisForceBarrierGraceSec: 0.0
  seventhAxisForceBarrierStableSamples: 1
  seventhAxisPollIntervalSec: 0.01
  # Table B DXF sanding paths keep wait=false for smooth motion, then wait
  # every N points so the robot controller buffer cannot outrun long paths.
  tableBDxfMotionFlushEveryPoints: 8
  # Short controller settle after each Table B DXF sanding flush point. This prevents
  # long multi-cycle zigzag paths from immediately feeding the next command while the
  # controller is still clearing its blended queue.
  tableBDxfMotionFlushSettleSec: 0.25
  # State-based controller-ready barrier at Table B DXF sanding batch boundaries.
  # This is not a fixed delay: it polls robot state and continues as soon as the
  # controller reports stable idle before the next MoveL batch is sent.
  tableBDxfMotionReadyTimeoutSec: 2.0
  tableBDxfMotionReadyStableSamples: 2
  # Move J7 and the robot arm to the next Table B DXF prepoint at the same time.
  # Force starts only after the arm is at preheight and J7 is confirmed idle.
  tableBDxfSimultaneousJ7Robot: true
  # Safe free-space Z for Table B DXF Tool 1/3/4 travel, retract, and stop lift.
  # Table B +Z points down, so -50 is above the sanding surface.
  safeTravelZMm: -50.0
  # If any robot joint is within this many degrees of its physical limit before a
  # Table B DXF Tool 1/3/4 transition, finish J7 first instead of moving J7+arm together.
  tableBDxfJointTransitionLimitMarginDeg: 10.0
  # Short synchronization only when Table B DXF switches operation family with the
  # same mounted tool, e.g. Tool 4 frame -> Tool 4 pocket zigzag.
  operationBoundaryBlendTimeoutSec: 1.5
  # When leaving a low-Y/bottom pose for Tool 1/3/4, move above the low-Y reach
  # threshold by this margin before shifting J7 so local X cannot go negative.
  lowYEscapeMarginMm: 25.0
  # homingSpeed: 1.0

